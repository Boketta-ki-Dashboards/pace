name: iOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pace.xcodeproj \
            -scheme Pace \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: No compiler warnings in Pace sources
        # Warnungen aus Abhängigkeiten (SourcePackages) werden ignoriert, Warnungen in eigenem Code nicht.
        run: |
          grep -E "^$GITHUB_WORKSPACE/(Pace|Packages)/[^:]+:[0-9]+:[0-9]+: warning:" build.log | sort -u > warnings.txt || true
          if [ -s warnings.txt ]; then
            cat warnings.txt
            echo "::error::$(wc -l < warnings.txt) Compiler-Warnung(en) in Pace-Code"
            exit 1
          fi
          echo "Keine Warnungen in Pace-Code."

      - name: Verify Info.plist privacy strings
        # Ohne NSHealthShareUsageDescription beendet iOS die App beim Permission-Request.
        run: |
          PLIST=build/DerivedData/Build/Products/Debug-iphonesimulator/Pace.app/Info.plist
          plutil -extract NSHealthShareUsageDescription raw "$PLIST"
          # Supabase-Werte kommen aus Config/Pace.xcconfig; in der CI sind sie leer, die Schlüssel müssen aber existieren.
          plutil -extract PaceSupabaseURL raw "$PLIST" >/dev/null
          plutil -extract PaceSupabasePublishableKey raw "$PLIST" >/dev/null
          # Pace schreibt nichts in Health – der Schreib-Text darf deshalb nicht enthalten sein.
          if plutil -extract NSHealthUpdateUsageDescription raw "$PLIST" >/dev/null 2>&1; then
            echo "NSHealthUpdateUsageDescription darf nicht gesetzt sein"; exit 1
          fi

      - name: Build-time key check rejects secret keys
        # Config/check_supabase_key.sh läuft als Build-Phase; hier wird geprüft, dass sie geheime Keys erkennt.
        run: |
          b64url() { printf '%s' "$1" | base64 | tr '+/' '-_' | tr -d '=\n'; }
          sh Config/check_supabase_key.sh
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_example sh Config/check_supabase_key.sh
          ANON="$(b64url '{"alg":"HS256"}').$(b64url '{"role":"anon"}').test"
          SUPABASE_PUBLISHABLE_KEY="$ANON" sh Config/check_supabase_key.sh
          SERVICE="$(b64url '{"alg":"HS256"}').$(b64url '{"role":"service_role"}').test"
          for key in sb_secret_test "$SERVICE"; do
            if SUPABASE_PUBLISHABLE_KEY="$key" sh Config/check_supabase_key.sh 2>/dev/null; then
              echo "::error::Geheimer Key wurde nicht abgelehnt"
              exit 1
            fi
          done
          echo "Key-Prüfung erkennt Secret- und service_role-Keys."

      - name: Select simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pace.xcodeproj \
            -scheme Pace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Backend integration tests build on macOS
        # Ohne Supabase-Umgebung werden die Integrationstests übersprungen (sie laufen in backend.yml gegen einen
        # lokalen Stack). Hier wird geprüft, dass das Paket auf dem Mac baut, wie in docs/BACKEND.md beschrieben.
        run: |
          set -o pipefail
          cd Packages/PaceBackendIntegrationTests
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/integration-macos.log"

      - name: No compiler warnings in test code
        run: |
          grep -hE "^$GITHUB_WORKSPACE/(Pace|Packages)/[^:]+:[0-9]+:[0-9]+: warning:" test.log integration-macos.log \
            | grep -v "/.build/" | sort -u > test-warnings.txt || true
          if [ -s test-warnings.txt ]; then
            cat test-warnings.txt
            echo "::error::$(wc -l < test-warnings.txt) Compiler-Warnung(en) in Test-Code"
            exit 1
          fi
          echo "Keine Warnungen in Test-Code."
