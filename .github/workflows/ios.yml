name: iOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pace.xcodeproj \
            -scheme Pace \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Info.plist privacy strings
        # Ohne NSHealthShareUsageDescription beendet iOS die App beim Permission-Request.
        run: |
          PLIST=build/DerivedData/Build/Products/Debug-iphonesimulator/Pace.app/Info.plist
          plutil -extract NSHealthShareUsageDescription raw "$PLIST"
          # Pace schreibt nichts in Health – der Schreib-Text darf deshalb nicht enthalten sein.
          if plutil -extract NSHealthUpdateUsageDescription raw "$PLIST" >/dev/null 2>&1; then
            echo "NSHealthUpdateUsageDescription darf nicht gesetzt sein"; exit 1
          fi

      - name: Select simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pace.xcodeproj \
            -scheme Pace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
